<script type="text/babel" data-presets="react">
const useReveal = () => {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current) return;
    let cancelled = false;
    const reveal = () => { if (!cancelled) setVisible(true); };
    const safety = setTimeout(reveal, 400);
    const raf = requestAnimationFrame(() => {
      if (!ref.current || cancelled) return;
      const rect = ref.current.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (rect.top < vh && rect.bottom > 0) reveal();
    });
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { reveal(); io.disconnect(); }
    }, { threshold: 0 });
    io.observe(ref.current);
    return () => { cancelled = true; clearTimeout(safety); cancelAnimationFrame(raf); io.disconnect(); };
  }, []);
  return [ref, visible];
};

const Reveal = ({ children, delay = 0, y = 24, as: Tag = 'div', style, ...rest }) => {
  const [ref, visible] = useReveal();
  return (
    <Tag ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : `translateY(${y}px)`,
      transition: `opacity 900ms cubic-bezier(.2,.7,.2,1) ${delay}ms, transform 900ms cubic-bezier(.2,.7,.2,1) ${delay}ms`,
      ...style,
    }} {...rest}>{children}</Tag>
  );
};

// Le titre se dépose à l'encre : chaque lettre émerge floue puis se fixe, de gauche
// à droite, sans curseur — le geste d'une plume plutôt qu'une machine à écrire.
const TypedTitle = ({ theme }) => {
  const head = 'Notre plume au service de ';
  const tail = 'ceux qui dessinent le paysage immobilier.';
  const [ref, visible] = useReveal();
  const reduced = typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const on = visible && !reduced ? true : visible;

  let k = 0;
  const inkChar = (ch, key) => {
    const d = 180 + k * 34; k += 1;
    return (
      <span key={key} style={{
        display:'inline-block',
        opacity: on ? 1 : 0,
        filter: on ? 'blur(0px)' : 'blur(5px)',
        transform: on ? 'none' : 'translateY(.08em) scale(.98)',
        transition: reduced ? 'none' : `opacity 520ms cubic-bezier(.2,.7,.2,1) ${d}ms, filter 620ms cubic-bezier(.2,.7,.2,1) ${d}ms, transform 620ms cubic-bezier(.2,.7,.2,1) ${d}ms`,
      }}>{ch}</span>
    );
  };
  // Un bloc par mot : les coupures de ligne ne peuvent tomber qu'entre les mots.
  const ink = (text, tag) => text.split(' ').map((word, w, arr) => (
    <React.Fragment key={tag + w}>
      <span style={{ display:'inline-block', whiteSpace:'nowrap' }}>
        {Array.from(word).map((ch, i) => inkChar(ch, tag + w + '-' + i))}
      </span>
      {w < arr.length - 1 ? ' ' : null}
    </React.Fragment>
  ));

  return (
    <h2 ref={ref} style={{ fontFamily:theme.serif, fontSize:'clamp(30px,3.6vw,56px)', lineHeight:1.1, fontWeight:300, fontStyle:'italic', letterSpacing:'-0.015em', margin:'0 0 clamp(36px,4vw,56px)', maxWidth:'34ch', textWrap:'balance' }}>
      {ink(head.trim(), 'h')}{' '}
      <span style={{ fontStyle:'italic', color:theme.accent }}>{ink(tail, 'i')}</span>
    </h2>
  );
};

const CURSOR_SURVOL = '#9B85FF';

// Curseurs système : flèches classiques, plus le A signature en option.
const A_APEX = [5.2, 2.4], A_LEFT = [2.2, 18.4], A_RIGHT = [9.1, 13.4], A_BAR = 0.7;
const aStrokes = () => {
  const lx = A_APEX[0] + (A_LEFT[0] - A_APEX[0]) * A_BAR, rx = A_APEX[0] + (A_RIGHT[0] - A_APEX[0]) * A_BAR;
  const by = A_APEX[1] + (A_LEFT[1] - A_APEX[1]) * A_BAR;
  return {
    left:  `M${A_APEX[0]} ${A_APEX[1]} L${A_LEFT[0]} ${A_LEFT[1]}`,
    right: `M${A_APEX[0]} ${A_APEX[1]} L${A_RIGHT[0]} ${A_RIGHT[1]}`,
    bar:   `M${lx.toFixed(2)} ${by.toFixed(2)} L${A_RIGHT[0]} ${A_RIGHT[1]}`,
    feet:  `M${A_LEFT[0]-1.1} ${A_LEFT[1]} L${A_LEFT[0]+1.1} ${A_LEFT[1]}`,
  };
};

// Flèche de curseur classique, pointe en haut à gauche
const ARROW = 'M4 2.6 L4 19.6 L8.5 15.3 L11.3 21 L13.7 19.9 L11 14.3 L17.1 13.9 Z';

const cursorSvg = (shape, ink) => {
  const shadow = '<filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy=".5" stdDeviation=".6" flood-color="#000" flood-opacity=".55"/></filter>';
  let body, size = 24, rotate = '';
  if (shape === 'plein') {
    body = `<path d="${ARROW}" fill="${ink}" stroke="rgba(0,0,0,.6)" stroke-width=".8" stroke-linejoin="round"/>`;
  } else if (shape === 'fin') {
    body = `<path d="${ARROW}" fill="rgba(12,9,5,.32)" stroke="${ink}" stroke-width="1" stroke-linejoin="round"/>`;
  } else {
    const a = aStrokes(); size = 24; rotate = ' transform="rotate(-34 5.2 2.4)"';
    const st = (d, w, o) => `<path d="${d}" fill="none" stroke="${ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${o ? ` opacity="${o}"` : ''}/>`;
    body = st(a.left, 1) + st(a.right, 1.7) + st(a.bar, .95) + st(a.feet, .8);
  }
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24">${shadow}<g filter="url(#s)"${rotate}>${body}</g></svg>`);
};

const CURSOR_VARIANTS = [
  { id:'fleche-pleine', name:'Flèche pleine', hint:'Flèche blanche cernée — la plus classique', shape:'plein' },
  { id:'fleche-fine', name:'Flèche contour', hint:'Flèche en trait fin, fond légèrement teinté', shape:'fin' },
  { id:'plume', name:'A signature', hint:'Le A du cabinet — le plus typé', shape:'plume' },
  { id:'natif', name:'Curseur système', hint:'Aucune personnalisation', native:true },
];

const CustomCursor = ({ theme, variant }) => {
  const v = variant || CURSOR_VARIANTS[0];
  React.useEffect(() => {
    if (v.native) return;
    const ink = '#9B85FF';
    const base = cursorSvg(v.shape, ink);
    const over = cursorSvg(v.shape, CURSOR_SURVOL);
    const style = document.createElement('style');
    style.textContent = `
      html, body { cursor: url("${base}") 6 3, default !important }
      a, button, [role="button"], summary, label, [data-cursor] { cursor: url("${over}") 6 3, pointer !important }
      input, textarea, select { cursor: url("${over}") 6 3, text !important }
      [disabled], button:disabled { cursor: url("${base}") 6 3, not-allowed !important }
    `;
    document.head.appendChild(style);
    return () => { if (style.parentNode) document.head.removeChild(style); };
  }, [v]);
  return null;
};

window.CURSOR_VARIANTS = CURSOR_VARIANTS;

const ScrollProgress = ({ theme }) => {
  const [pct, setPct] = React.useState(0);
  React.useEffect(() => {
    const onScroll = () => {
      const total = document.body.scrollHeight - window.innerHeight;
      setPct(total > 0 ? (window.scrollY / total) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div style={{ position:'fixed', top:0, left:0, zIndex:48, height:2, background:theme.accent, width:`${pct}%`, transition:'width 80ms linear', pointerEvents:'none' }} />;
};

const SectionDots = ({ theme }) => {
  const sections = [
    { id:'top', label:'Accueil' }, { id:'expertises', label:'Expertises' },
    { id:'equipe', label:'Équipe' },
    { id:'articles', label:'Articles' }, { id:'contact', label:'Contact' },
  ];
  const [active, setActive] = React.useState(0);
  React.useEffect(() => {
    const observers = sections.map(({ id }, i) => {
      const el = document.getElementById(id);
      if (!el) return null;
      const io = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setActive(i); }, { threshold: 0.3 });
      io.observe(el);
      return io;
    });
    return () => observers.forEach(io => io && io.disconnect());
  }, []);
  return (
    <div style={{ position:'fixed', left:20, top:'50%', transform:'translateY(-50%)', zIndex:30, display:'flex', flexDirection:'column', gap:10 }}>
      {sections.map(({ id, label }, i) => (
        <a key={id} href={`#${id}`} title={label} style={{ textDecoration:'none' }}>
          <div style={{ width:6, height:6, borderRadius:'50%', border:`1px solid ${theme.fgSoft}`, background: active===i ? theme.accent : 'transparent', transform: active===i ? 'scale(1.4)' : 'scale(1)', transition:'background 300ms, transform 300ms, border-color 300ms', borderColor: active===i ? theme.accent : theme.fgSoft }} />
        </a>
      ))}
    </div>
  );
};

window.Reveal = Reveal;
window.useReveal = useReveal;
window.CustomCursor = CustomCursor;
window.ScrollProgress = ScrollProgress;
window.SectionDots = SectionDots;
</script>

const useCountUp = (target, duration=1800) => {
  const [count, setCount] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const io = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      io.disconnect();
      const start = performance.now();
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const tick = now => { const e = Math.min((now-start)/duration,1); setCount(Math.round(ease(e)*target)); if (e<1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }, { threshold:0.3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, [target, duration]);
  return [ref, count];
};

<!-- ── Tweaks panel ───────────────────────────────────────────────────────────── -->
<script type="text/babel" data-presets="react">
const TweaksPanel = ({ themeIdx, setThemeIdx, logoIdx, setLogoIdx, legibilityIdx, setLegibilityIdx, accentColor, setAccentColor, baseTheme, expertisesLayout, setExpertisesLayout, logoDot, setLogoDot, cursorIdx, setCursorIdx, hoverIdx, setHoverIdx, visible, onClose }) => {
  if (!visible) return null;
  const themes = window.AMI_THEMES, logos = window.LOGO_VARIANTS, legs = window.LEGIBILITY_VARIANTS || [];
  const currentLeg = legs[legibilityIdx] || legs[0];
  const effectiveAccent = accentColor || (baseTheme && baseTheme.accent) || themes[themeIdx].accent;
  // Spectre de teintes pour le slider rapide (couvre les chaudes → froides)
  const HUE_SPECTRUM = 'linear-gradient(90deg, #E5651A 0%, #D45510 8%, #B8421C 18%, #8B3A1F 28%, #7A1F2B 38%, #4E121A 46%, #2E2A22 54%, #1F3A5C 64%, #1F3A2C 74%, #5E5A28 82%, #B27532 90%, #E5651A 100%)';
  const SPECTRUM_STOPS = ['#E5651A','#D45510','#B8421C','#8B3A1F','#7A1F2B','#4E121A','#2E2A22','#1F3A5C','#1F3A2C','#5E5A28','#B27532','#E5651A'];
  const sliderRef = React.useRef(null);
  const pickFromSlider = (clientX) => {
    const el = sliderRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    // Interpolation linéaire entre les stops du spectre
    const idx = t * (SPECTRUM_STOPS.length - 1);
    const lo = Math.floor(idx), hi = Math.min(SPECTRUM_STOPS.length - 1, lo + 1);
    const frac = idx - lo;
    const mix = (a, b) => {
      const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
      const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
      const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
      const rr = Math.round(ar + (br - ar) * frac);
      const gg = Math.round(ag + (bg - ag) * frac);
      const bbo = Math.round(ab + (bb - ab) * frac);
      return '#' + [rr,gg,bbo].map(x => x.toString(16).padStart(2,'0')).join('');
    };
    setAccentColor(mix(SPECTRUM_STOPS[lo], SPECTRUM_STOPS[hi]));
  };
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:100, width:380, background:'#0f0f0f', color:'#fff', border:'1px solid #333', borderRadius:8, boxShadow:'0 24px 60px rgba(0,0,0,.4)', fontFamily:'"Inter Tight",sans-serif', maxHeight:'85vh', overflowY:'auto' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 18px', borderBottom:'1px solid #222', position:'sticky', top:0, background:'#0f0f0f', zIndex:1 }}>
        <div style={{ fontSize:12, letterSpacing:2, textTransform:'uppercase', fontWeight:500 }}>Tweaks</div>
        <button onClick={onClose} style={{ background:'transparent', border:'none', color:'#888', cursor:'pointer', fontSize:16 }}>×</button>
      </div>

      {/* ── Couleur d'accent (nuancier continu) ── */}
      <div style={{ padding:18, borderBottom:'1px solid #1a1a1a' }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:4 }}>Couleur d'accent</div>
        <div style={{ fontSize:11, color:'#bbb', marginBottom:14, lineHeight:1.5 }}>
          Affecte le mot « avocats », tous les accents italiques, dots, bordures et boutons d'accent.
        </div>

        {/* Nuancier (gradient cliquable) */}
        <div ref={sliderRef}
          onMouseDown={(e) => { pickFromSlider(e.clientX); const move = (ev) => pickFromSlider(ev.clientX); const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }; window.addEventListener('mousemove', move); window.addEventListener('mouseup', up); }}
          style={{ height:32, borderRadius:4, background:HUE_SPECTRUM, cursor:'crosshair', position:'relative', border:'1px solid #2a2a2a', marginBottom:10 }}>
          <div style={{ position:'absolute', top:0, bottom:0, left:0, right:0, pointerEvents:'none' }}/>
        </div>

        {/* Sélecteur natif + champ hex + reset */}
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
          <label style={{ position:'relative', width:36, height:36, borderRadius:4, overflow:'hidden', border:'1px solid #2a2a2a', cursor:'pointer', flexShrink:0, background:effectiveAccent }}>
            <input type="color" value={effectiveAccent} onChange={(e) => setAccentColor(e.target.value)} style={{ position:'absolute', inset:0, opacity:0, cursor:'pointer' }}/>
          </label>
          <input type="text" value={effectiveAccent.toUpperCase()}
            onChange={(e) => { const v = e.target.value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v)) setAccentColor(v); }}
            style={{ flex:1, padding:'9px 10px', background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:4, color:'#fff', fontFamily:'ui-monospace,Menlo,monospace', fontSize:12, outline:'none' }}/>
          <button onClick={() => setAccentColor(null)} title="Revenir à l'orange d'origine"
            style={{ padding:'9px 10px', background:'transparent', border:'1px solid #2a2a2a', borderRadius:4, color:'#bbb', cursor:'pointer', fontSize:11, letterSpacing:1, textTransform:'uppercase', flexShrink:0, fontFamily:'inherit' }}>Reset</button>
        </div>

        {/* Aperçu */}
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background:'#1a1a1a', border:'1px solid #222', borderRadius:4 }}>
          <span style={{ fontFamily:'"Cormorant Garamond",serif', fontSize:22, fontStyle:'italic', color:effectiveAccent, lineHeight:1 }}>avocats</span>
          <span style={{ fontSize:11, color:'#666', marginLeft:'auto' }}>{accentColor ? 'personnalisé' : 'défaut'}</span>
        </div>
      </div>

      {/* ── Layout des expertises ── */}
      <div style={{ padding:18, borderBottom:'1px solid #1a1a1a' }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:4 }}>Layout des expertises</div>
        <div style={{ fontSize:11, color:'#bbb', marginBottom:14, lineHeight:1.5 }}>
          Mise en forme des 7 spécialités.
        </div>
        <div style={{ display:'grid', gap:6 }}>
          {[
            { id:'featured', name:'Manifeste + grille',  desc:'1 case large + 3 + 3 (actuel)' },
            { id:'liste',    name:'Sommaire éditorial',  desc:'7 lignes pleine largeur, type index' },
            { id:'bandeaux', name:'Bandeaux horizontaux',desc:'Bandes empilées, expansion au hover' },
            { id:'flow',     name:'Flow inline',         desc:'Pastilles qui coulent, sans grille' },
          ].map(opt => (
            <button key={opt.id} onClick={() => setExpertisesLayout(opt.id)}
              style={{ padding:'10px 12px', background:expertisesLayout===opt.id?'#1c1c1c':'transparent', color:'#fff', border:expertisesLayout===opt.id?`1px solid ${baseTheme.accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit', display:'flex', justifyContent:'space-between', alignItems:'center', gap:8 }}>
              <div style={{minWidth:0, flex:1}}>
                <div style={{ fontSize:12, fontWeight:500 }}>{opt.name}</div>
                <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{opt.desc}</div>
              </div>
              {expertisesLayout===opt.id && <span style={{ color:baseTheme.accent, fontSize:14, flexShrink:0 }}>●</span>}
            </button>
          ))}
        </div>
      </div>

      {/* ── Lisibilité (filtre vidéo) ── */}
      <div style={{ padding:18, borderBottom:'1px solid #1a1a1a' }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:4 }}>Lisibilité · filtre vidéo · {legibilityIdx+1}/{legs.length}</div>
        <div style={{ fontSize:11, color:'#bbb', marginBottom:14, lineHeight:1.5 }}>
          Adoucit les zones violettes de la vidéo pour préserver la lisibilité du texte orange. <span style={{color:'#666'}}>(Shift+L)</span>
        </div>
        <div style={{ display:'grid', gap:5 }}>
          {legs.map((v, i) => (
            <button key={v.id} onClick={() => setLegibilityIdx(i)} style={{ padding:'9px 12px', background:legibilityIdx===i?'#1c1c1c':'transparent', color:'#fff', border:legibilityIdx===i?`1px solid ${themes[themeIdx].accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit', display:'flex', justifyContent:'space-between', alignItems:'center', gap:8 }}>
              <div style={{minWidth:0, flex:1}}>
                <div style={{ fontSize:12, fontWeight:500 }}>{v.name}</div>
                <div style={{ fontSize:11, color:'#888', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{v.desc}</div>
              </div>
              {legibilityIdx===i && <span style={{ color:themes[themeIdx].accent, fontSize:14, flexShrink:0 }}>●</span>}
            </button>
          ))}
        </div>
        {currentLeg && currentLeg.filter && currentLeg.filter !== 'none' && (
          <div style={{ marginTop:12, padding:'8px 10px', background:'#1a1a1a', border:'1px solid #222', borderRadius:4, fontFamily:'ui-monospace,Menlo,monospace', fontSize:11, color:'#9aa', lineHeight:1.4, wordBreak:'break-all' }}>
            filter: {currentLeg.filter}
          </div>
        )}
      </div>

      {/* ── Univers visuel ── */}
      <div style={{ padding:18 }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:12 }}>Univers visuel · {themeIdx+1}/{themes.length}</div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:8 }}>
          {themes.map((t, i) => (
            <button key={t.id} onClick={() => setThemeIdx(i)} style={{ padding:10, background:t.bg, color:t.fg, border:themeIdx===i?`2px solid ${t.accent}`:'2px solid transparent', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit' }}>
              <div style={{ display:'flex', gap:4, marginBottom:6 }}>
                <div style={{ width:12, height:12, background:t.accent, borderRadius:2 }}/><div style={{ width:12, height:12, background:t.fg, borderRadius:2 }}/><div style={{ width:12, height:12, background:t.bgAlt, borderRadius:2, border:`1px solid ${t.line}22` }}/>
              </div>
              <div style={{ fontSize:11, fontWeight:500 }}>{t.name}</div>
            </button>
          ))}
        </div>
        <div style={{ fontSize:11, color:'#888', marginTop:8, lineHeight:1.4 }}>{themes[themeIdx].subtitle}</div>
      </div>
      <div style={{ padding:'0 18px 18px' }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:12 }}>Logo · {logoIdx+1}/{logos.length}</div>
        <div style={{ display:'grid', gap:6 }}>
          {logos.map((l, i) => (
            <button key={l.id} onClick={() => setLogoIdx(i)} style={{ padding:'10px 12px', background:logoIdx===i?'#1c1c1c':'transparent', color:'#fff', border:logoIdx===i?`1px solid ${themes[themeIdx].accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div><div style={{ fontSize:12, fontWeight:500 }}>{l.name}</div><div style={{ fontSize:11, color:'#888', marginTop:2 }}>{l.description}</div></div>
              {logoIdx===i && <span style={{ color:themes[themeIdx].accent, fontSize:14 }}>●</span>}
            </button>
          ))}
        </div>
      </div>
      <div style={{ padding:'0 18px 18px' }}>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:4 }}>Point du logo</div>
        <div style={{ fontSize:11, color:'#bbb', marginBottom:12, lineHeight:1.5 }}>Uniquement pour le logo « A. — point éditorial ».</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
          {[{ id:'a', label:'« a » dans le point', hint:'Cormorant italique, blanc' },{ id:'plein', label:'Point plein', hint:'Version d\u2019origine' }].map(o => (
            <button key={o.id} onClick={() => setLogoDot(o.id)} style={{ padding:'10px 12px', background:logoDot===o.id?'#1c1c1c':'transparent', color:'#fff', border:logoDot===o.id?`1px solid ${themes[themeIdx].accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit' }}>
              <div style={{ fontSize:11, fontWeight:500 }}>{o.label}</div>
              <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{o.hint}</div>
            </button>
          ))}
        </div>
      </div>
      <div style={{ padding:'0 18px 18px' }}>

        <div style={{ fontSize:11, color:'#bbb', marginBottom:12, lineHeight:1.5 }}>Couleur des cartes au passage de la souris.</div>
        <div style={{ display:'grid', gap:6, marginBottom:22 }}>
          {(window.HOVER_VARIANTS||[]).map((v, i) => (
            <button key={v.id} onClick={() => setHoverIdx(i)} style={{ padding:'10px 12px', background:hoverIdx===i?'#1c1c1c':'transparent', color:'#fff', border:hoverIdx===i?`1px solid ${themes[themeIdx].accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit' }}>
              <div style={{ fontSize:11, fontWeight:500 }}>{v.name}</div>
              <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{v.hint}</div>
            </button>
          ))}
        </div>
        <div style={{ fontSize:11, letterSpacing:2, color:'#888', textTransform:'uppercase', marginBottom:4 }}>Curseur</div>
        <div style={{ fontSize:11, color:'#bbb', marginBottom:12, lineHeight:1.5 }}>Signale les zones clicables au survol.</div>
        <div style={{ display:'grid', gap:6 }}>
          {(window.CURSOR_VARIANTS||[]).map((c, i) => (
            <button key={c.id} onClick={() => setCursorIdx(i)} style={{ padding:'10px 12px', background:cursorIdx===i?'#1c1c1c':'transparent', color:'#fff', border:cursorIdx===i?`1px solid ${themes[themeIdx].accent}`:'1px solid #222', borderRadius:4, cursor:'pointer', textAlign:'left', fontFamily:'inherit' }}>
              <div style={{ fontSize:11, fontWeight:500 }}>{c.name}</div>
              <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{c.hint}</div>
            </button>
          ))}
        </div>
      </div>
      <div style={{ padding:'12px 18px', borderTop:'1px solid #222', fontSize:11, color:'#666', lineHeight:1.5 }}>{legs.length} filtres vidéo · {themes.length} univers · {logos.length} logos. Shift+L · ←↑→↓</div>
    </div>
  );
};

window.LogoShowcase = LogoShowcase;
</script>

<!-- ── App ───────────────────────────────────────────────────────────────────── -->
<script type="text/babel" data-presets="react">
const SURFACES = { surface:'rgba(255,170,51,0.55)', surfaceHover:'rgba(255,185,80,0.72)', surfaceLine:'rgba(255,200,100,0.3)' };
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "themeIdx": 0,
  "logoIdx": 10,
  "legibilityIdx": 0,
  "accentColor": "#000000",
  "accentIdx": 10,
  "logoDot": "plein",
  "cursorIdx": 0,
  "hoverIdx": 3,
  "expertisesLayout": "featured"
}/*EDITMODE-END*/;

// Assombrit un hex de ~30 % (pour générer accentDeep auto)
const darkenHex = (hex, amount = 0.32) => {
  if (!hex || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.round(((n >> 16) & 255) * (1 - amount)));
  const g = Math.max(0, Math.round(((n >> 8)  & 255) * (1 - amount)));
  const b = Math.max(0, Math.round((n & 255) * (1 - amount)));
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
};

const App = () => {
  const [themeIdx, setThemeIdx] = React.useState(TWEAK_DEFAULTS.themeIdx);
  const [logoIdx, setLogoIdx] = React.useState(TWEAK_DEFAULTS.logoIdx);
  const [legibilityIdx, setLegibilityIdx] = React.useState(TWEAK_DEFAULTS.legibilityIdx);
  const [accentColor, setAccentColor] = React.useState(TWEAK_DEFAULTS.accentColor || null);
  const [expertisesLayout, setExpertisesLayout] = React.useState(TWEAK_DEFAULTS.expertisesLayout || 'featured');
  const [logoDot, setLogoDot] = React.useState(TWEAK_DEFAULTS.logoDot || 'plein');
  const [cursorIdx, setCursorIdx] = React.useState(TWEAK_DEFAULTS.cursorIdx || 0);
  const [hoverIdx, setHoverIdx] = React.useState(TWEAK_DEFAULTS.hoverIdx || 0);
  const cursorVariant = (window.CURSOR_VARIANTS || [])[cursorIdx] || (window.CURSOR_VARIANTS || [])[0];
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [showcaseOpen, setShowcaseOpen] = React.useState(false);

  const baseTheme = window.AMI_THEMES[themeIdx];
  const theme = React.useMemo(() => {
    // On garde toujours l'accent d'origine sous `originalAccent` pour les
    // éléments qu'on souhaite préserver (logo, boutons clés…)
    if (!accentColor) return { ...baseTheme, logoDot, originalAccent: baseTheme.accent, originalAccentDeep: baseTheme.accentDeep, ...SURFACES };
    return { ...baseTheme, logoDot, ...SURFACES, accent: accentColor, accentDeep: darkenHex(accentColor, 0.32), originalAccent: baseTheme.accent, originalAccentDeep: baseTheme.accentDeep };
  }, [baseTheme, accentColor, logoDot]);
  const logo = window.LOGO_VARIANTS[logoIdx];

  React.useEffect(() => {
    try {
      const saved = localStorage.getItem('ami-tweaks-v3');
      if (saved) { const { themeIdx:ti, logoIdx:li, legibilityIdx:lg } = JSON.parse(saved); if (typeof ti==='number') setThemeIdx(ti); if (typeof li==='number') setLogoIdx(li); if (typeof lg==='number') setLegibilityIdx(lg); } } catch(e) {}
  }, []);
  React.useEffect(() => { try { localStorage.setItem('ami-tweaks-v3', JSON.stringify({ themeIdx, logoIdx, legibilityIdx })); } catch(e) {} }, [themeIdx, logoIdx, legibilityIdx]);
  React.useEffect(() => {
    const onKey = e => {
      if (e.key==='ArrowRight'&&e.shiftKey) setThemeIdx(i => (i+1)%window.AMI_THEMES.length);
      if (e.key==='ArrowLeft'&&e.shiftKey)  setThemeIdx(i => (i-1+window.AMI_THEMES.length)%window.AMI_THEMES.length);
      if (e.key==='ArrowUp'&&e.shiftKey)    setLogoIdx(i => (i-1+window.LOGO_VARIANTS.length)%window.LOGO_VARIANTS.length);
      if (e.key==='ArrowDown'&&e.shiftKey)  setLogoIdx(i => (i+1)%window.LOGO_VARIANTS.length);
      // Shift+L = cycle legibility variants
      if ((e.key==='l'||e.key==='L')&&e.shiftKey) setLegibilityIdx(i => (i+1)%window.LEGIBILITY_VARIANTS.length);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Applique le filtre CSS au <video> du hero
  React.useEffect(() => {
    const v = document.getElementById('hero-video');
    if (!v) return;
    const variant = window.LEGIBILITY_VARIANTS[legibilityIdx] || window.LEGIBILITY_VARIANTS[0];
    v.style.transition = 'filter 600ms ease';
    v.style.filter = variant.filter || 'none';
  }, [legibilityIdx]);

  // Branchement avec le bouton "Tweaks" de la barre d'outils + persistance disque
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e && e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type:'__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Quand le panneau Tweaks se ferme via la croix interne, prévenir l'hôte
  const closeTweaks = React.useCallback(() => {
    setTweaksOpen(false);
    try { window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); } catch(e) {}
  }, []);

  // Persiste la lisibilité côté disque (réécriture du bloc EDITMODE)
  const setLegibilityIdxPersist = React.useCallback((next) => {
    setLegibilityIdx(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ legibilityIdx: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);

  // Persiste la couleur d'accent côté disque
  const setAccentColorPersist = React.useCallback((next) => {
    setAccentColor(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ accentColor: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);

  // Persiste le layout des expertises
  const setExpertisesLayoutPersist = React.useCallback((next) => {
    setExpertisesLayout(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ expertisesLayout: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);

  // Persiste le curseur et le point du logo
  const setHoverIdxPersist = React.useCallback((next) => {
    setHoverIdx(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ hoverIdx: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);
  const setCursorIdxPersist = React.useCallback((next) => {
    setCursorIdx(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ cursorIdx: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);
  const setLogoDotPersist = React.useCallback((next) => {
    setLogoDot(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ logoDot: v } }, '*'); } catch(e) {}
      return v;
    });
  }, []);

  React.useEffect(() => {
    document.body.style.background = theme.bg;
    document.body.style.transition = 'background 500ms ease';
  }, [theme.bg]);

  return (
    <div style={{ color:theme.fg, minHeight:'100dvh', transition:'color 500ms ease' }}>
      <CustomCursor theme={theme} variant={cursorVariant}/>
      <ScrollProgress theme={theme}/>
      <SectionDots theme={theme}/>
      <Nav theme={theme} logo={logo}/>
      <Hero theme={theme} logo={logo}/>
      <Expertises theme={theme} hoverIdx={hoverIdx} layout={expertisesLayout}/>
      <Team theme={theme}/>
      <Articles theme={theme}/>
      <Contact theme={theme}/>
      <Footer theme={theme} logo={logo}/>

      <div style={{ position:'fixed', right:0, top:'50%', transform:'translateY(-50%)', zIndex:39, display:'flex', flexDirection:'column', alignItems:'start' }}>
        <a href="#contact" style={{ padding:'14px 10px', background:theme.originalAccent || theme.accent, color:'#fff', fontFamily:theme.mono, fontSize:11, letterSpacing:2.5, textTransform:'uppercase', textDecoration:'none', writingMode:'vertical-rl', textAlign:'center', boxShadow:`-4px 0 20px ${(theme.originalAccent || theme.accent)}33`, transition:'background 200ms' }}
          onMouseEnter={e => e.currentTarget.style.background=theme.originalAccentDeep || theme.accentDeep}
          onMouseLeave={e => e.currentTarget.style.background=theme.originalAccent || theme.accent}>Contactez nous →</a>
        <a href="https://www.linkedin.com/company/ami-avocats" target="_blank" rel="noopener noreferrer"
          style={{ padding:'12px 10px', background:'transparent', border:`1px solid ${theme.fg}28`, borderTop:'none', color:theme.fg, display:'flex', alignItems:'center', justifyContent:'center', transition:'background 200ms' }}
          onMouseEnter={e => e.currentTarget.style.background=`${theme.fg}12`}
          onMouseLeave={e => e.currentTarget.style.background='transparent'}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>

      <TweaksPanel themeIdx={themeIdx} setThemeIdx={setThemeIdx} logoIdx={logoIdx} setLogoIdx={setLogoIdx} legibilityIdx={legibilityIdx} setLegibilityIdx={setLegibilityIdxPersist} accentColor={accentColor} setAccentColor={setAccentColorPersist} baseTheme={baseTheme} expertisesLayout={expertisesLayout} setExpertisesLayout={setExpertisesLayoutPersist} logoDot={logoDot} setLogoDot={setLogoDotPersist} cursorIdx={cursorIdx} setCursorIdx={setCursorIdxPersist} hoverIdx={hoverIdx} setHoverIdx={setHoverIdxPersist} visible={tweaksOpen} onClose={closeTweaks}/>
      <LogoShowcase theme={theme} logos={window.LOGO_VARIANTS} logoIdx={logoIdx} setLogoIdx={setLogoIdx} visible={showcaseOpen} onClose={() => setShowcaseOpen(false)}/>
    </div>
  );
};

const mount = () => {
  if (!window.AMI_THEMES||!window.LOGO_VARIANTS||!window.LEGIBILITY_VARIANTS||!window.Nav||!window.Hero||!window.TweaksPanel||!window.CustomCursor||!window.ScrollProgress||!window.SectionDots) {
    return setTimeout(mount, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
};
mount();
</script>

</body>
</html>
